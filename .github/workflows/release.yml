# Release otrust: build the binaries on a version tag, attest their build provenance (Sigstore,
# keyless) and publish them. The build command is the one the assessors use (assess.yml, the GitLab
# template), so the linux/amd64 digest a certificate records as agentDigest is the released binary's.
# -buildvcs=false: otherwise a tag in the checkout changes the stamped module version, and the digest.
# workflow_dispatch builds and attests without publishing a release.
# On a tag it also publishes otrust as an image (ghcr.io/<owner>/otrust) and assesses that image with
# this repository's own assessor (dogfooding): the certificate and evidence are attached to the release.
# Same-repository call, so the honest level is L1+ci-identity, not isolated-assessor.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance
      attestations: write # store it in GitHub's attestation API
      packages: write     # push the otrust image
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release build starts clean
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -buildvcs=false -o "dist/otrust-${t%/*}-${t#*/}" ./cmd/otrust
          done
          (cd dist && sha256sum otrust-* > SHA256SUMS && cat SHA256SUMS)
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(dist/otrust-linux-amd64 version)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::otrust version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/otrust-*
      - run: cp "${{ steps.attest.outputs.bundle-path }}" dist/otrust.provenance.sigstore.json
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "otrust $GITHUB_REF_NAME" \
            --notes "Verify a binary: \`gh attestation verify otrust-<os>-<arch> -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: startsWith(github.ref, 'refs/tags/')
      - name: Build and push the otrust image (and keep an OCI tar)
        id: image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          name=ghcr.io/${OWNER,,}/otrust
          docker login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          mkdir -p image
          docker buildx build --platform linux/amd64 --provenance=mode=min --sbom=false \
            --build-arg BIN=dist/otrust-linux-amd64 \
            --output type=oci,dest=image/image.oci.tar \
            --output "type=image,name=$name:$GITHUB_REF_NAME,push=true" \
            --metadata-file meta.json .
          idx=$(tar -xOf image/image.oci.tar index.json | jq -r '.manifests[0].digest')
          d=$(tar -xOf image/image.oci.tar "blobs/sha256/${idx#sha256:}" | jq -r '[.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")] | if length == 1 then .[0].digest else error("expected one image manifest") end')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "ref=$name@$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"
      - name: Attest the image's build provenance
        id: attest-image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          create-storage-record: false
      - name: Keep the image tar and its provenance for the assessment
        if: startsWith(github.ref, 'refs/tags/')
        run: cp "${{ steps.attest-image.outputs.bundle-path }}" image/provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: otrust-image
          path: image/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: otrust-dist
          path: dist/
          if-no-files-found: error

  # dogfooding: the released image, assessed by this repository's own assessor at this revision
  assess:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/assess.yml
    with:
      image-ref: ${{ needs.release.outputs.image-ref }}
      image-artifact: otrust-image
      subject-name: ghcr.io/dario-mr/otrust

  certificate:
    needs: [release, assess]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the certificate to the release
      packages: write # and to the image, so buyers verify ghcr.io/<owner>/otrust by reference alone
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otrust-otrust-image
          path: out
      - name: Attach the certificate and evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp out/certificate.sigstore.json otrust-image.certificate.sigstore.json
          cp out/certificate.quality-baseline.sigstore.json otrust-image.certificate.quality-baseline.sigstore.json
          tar -czf otrust-image.evidence.tar.gz -C out .
          gh release upload "$GITHUB_REF_NAME" otrust-image.certificate.sigstore.json otrust-image.certificate.quality-baseline.sigstore.json \
            otrust-image.evidence.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Attach the certificate to the image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.release.outputs.image-ref }}
        run: |
          set -euo pipefail
          # the binary this very release published (and attested); attaching adds no trust
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p otrust-linux-amd64 -p SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          chmod +x otrust-linux-amd64
          docker login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          for c in otrust-image.certificate.sigstore.json otrust-image.certificate.quality-baseline.sigstore.json; do
            ./otrust-linux-amd64 attach "$c" --image "$IMAGE"
          done
