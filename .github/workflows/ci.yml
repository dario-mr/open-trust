name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal profiles)" || { gofmt -l cmd internal profiles; exit 1; }
          go vet ./...
      - name: Unit and tamper tests
        run: go test ./...
      - name: Policy tests (opa)
        run: profiles/supply-chain-baseline/v1/test.sh
      - name: End-to-end (real scanners, sign, verify)
        run: |
          profiles/supply-chain-baseline/v1/fixtures/generate.sh
          OTRUST_E2E=1 go test -count=1 ./internal/assess/ ./internal/verify/
