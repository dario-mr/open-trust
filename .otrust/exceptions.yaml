# Exceptions for assessing otrust itself (Supply-Chain Baseline v1). Each one is recorded in the
# certificate with its reason and expiry, so buyers see exactly what was accepted. SAST exceptions
# name their file: the rule stays active everywhere else.
- check: secrets
  id: profiles/supply-chain-baseline/v1/fixtures/src/vulnerable/app/config/deploy.pem#private-key
  reason: Deliberately leaked test key in the profile's conformance fixture (the failing example); not used anywhere.
  expires: "2027-05-21T00:00:00Z"
- check: sast
  id: java.lang.security.audit.formatted-sql-string.formatted-sql-string
  path: profiles/supply-chain-baseline/v1/fixtures/src/vulnerable/app/Main.java
  reason: The conformance fixture's deliberate SQL injection (the failing example).
  expires: "2027-05-21T00:00:00Z"
- check: sast
  id: dockerfile.security.last-user-is-root.last-user-is-root
  path: demo/jenkins/Dockerfile
  reason: A local test harness that runs Jenkins as root to use the host's docker socket; it is not shipped.
  expires: "2027-05-21T00:00:00Z"
- check: sast
  id: go.lang.security.audit.dangerous-exec-command.dangerous-exec-command
  path: internal/adapters/adapters.go
  reason: The local scanner runner (--scanners local) executes otrust's own sha256-pinned Syft and Trivy, or Semgrep from PATH at the pinned version, with arguments otrust builds and no shell.
  expires: "2027-05-22T00:00:00Z"
