# Customer-side trust policy for the demo: accept only certificates signed by this repository's
# assessor workflow, from main, on a GitHub-hosted runner.
minTrustLevel: L1+ci-identity
signers:
  - name: open-trust demo pipeline
    issuer: https://token.actions.githubusercontent.com
    sourceRepo: https://github.com/dario-mr/open-trust
    sourceRef: refs/heads/main
    buildSigner: ^https://github\.com/dario-mr/open-trust/\.github/workflows/assess\.yml@
    requireHostedRunner: true
